function hakedisCiz() {
  const buAy = ayStr();
  const acik = hakedisler.find(h => h.ay === buAy);
  $('#s-hakedis').innerHTML = `
    <div class="sayfa-baslik"><h2>Hakedişler</h2><small class="soluk">Ay sonunda lokanta hakediş keser; ödeme yapıldığında "Ödendi" olarak işaretlenir.</small></div>
    <div class="tablo-kap"><table class="tablo"><thead><tr><th>Dönem</th><th class="sag">Öğün</th><th class="sag">Tutar</th><th>Durum</th><th>Kesim</th><th>Ödeme</th><th></th></tr></thead><tbody>
      ${!acik ? `<tr><td><b>${esc(ayAdi(buAy))}</b></td><td class="sag">—</td><td class="sag">—</td><td><span class="etiket">Devam ediyor</span></td><td>—</td><td>—</td><td class="sag"><button class="btn-cizgi btn-kucuk" data-ekstre="${buAy}">🖨️ Ekstre</button></td></tr>` : ''}
      ${hakedisler.map(h => `<tr><td><b>${esc(ayAdi(h.ay))}</b></td><td class="sag">${h.adet ?? '—'}</td><td class="sag"><b>${tl(h.toplam)}</b></td>
        <td>${h.durum === 'odendi' ? '<span class="etiket yesil">✓ Ödendi</span>' : '<span class="etiket sari">Ödeme bekliyor</span>'}</td>
        <td>${tarihFmt(h.kesimTarihi)}</td><td>${h.durum === 'odendi' ? tarihFmt(h.odemeTarihi) : '—'}</td>
        <td class="sag"><button class="btn-cizgi btn-kucuk" data-ekstre="${h.ay}">🖨️ Ekstre</button><button class="btn-cizgi btn-kucuk" data-ayexcel="${h.ay}">📥 Excel</button></td></tr>`).join('')}
    </tbody>${hakedisler.length ? `<tfoot><tr><td>Ödenmemiş toplam</td><td></td><td class="sag">${tl(hakedisler.filter(h => h.durum !== 'odendi').reduce((t, h) => t + (h.toplam || 0), 0))}</td><td colspan="4"></td></tr></tfoot>` : ''}</table></div>`;
}
async function ayinSiparisleri(ay) {
  if (ay === seciliAy) return siparisler;
  const s = await getDocs(query(collection(db, 'siparisler'), where('sirketId', '==', S.id), where('ay', '==', ay)));
  return s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => tsMs(a.olusturma) - tsMs(b.olusturma));
}

/* ------------------------------------------------------------------ */
/*  MENÜ ve HESAP                                                      */
/* ------------------------------------------------------------------ */
async function menuCiz() {
  const kap = $('#s-menu');
  if (!menuListe) { kap.innerHTML = '<div class="bos">Yükleniyor…</div>'; await menuYukle(); if (sekme !== 'menu') return; }
  const acik = menuListe.filter(m => m.aktif !== false);
  const g = {};
  acik.forEach(m => { const c = m.kategori || 'Diğer'; (g[c] = g[c] || []).push(m); });
  kap.innerHTML = `<div class="sayfa-baslik"><h2>Lokanta menüsü</h2><small class="soluk">Güncel fiyatlar · lokanta tarafından güncellenir</small></div>
    ${!acik.length ? '<div class="kart bos">Menü bilgisi yok.</div>' : Object.keys(g).sort(katSirala).map(c => `<div class="menu-grup"><h3>${esc(c)}</h3><div class="tablo-kap"><table class="tablo"><tbody>
      ${g[c].sort((a, b) => trSirala(a.ad, b.ad)).map(m => `<tr><td>${esc(m.ad)}</td><td class="sag"><b>${tl(m.fiyat)}</b></td></tr>`).join('')}</tbody></table></div></div>`).join('')}`;
}
function hesapCiz() {
  if (mod !== 'sirket') return;
  $('#s-hesap').innerHTML = `
    <div class="izgara-2">
      <div class="kart"><h3>Hesap bilgileri</h3>
        <div class="liste-satir"><span class="soluk">Ad Soyad</span><b>${esc(yetkiliBilgi.ad || '')}</b></div>
        <div class="liste-satir"><span class="soluk">E-posta</span><b>${esc(kullanici.email || '')}</b></div>
        <div class="liste-satir"><span class="soluk">Şirket</span><b>${esc(S.ad)}</b></div>
        <div class="liste-satir"><span class="soluk">Lokanta</span><b>${esc(genel.lokantaAdi || '')}</b></div>
      </div>
      <form class="kart" id="sifreForm"><h3>Şifre değiştir</h3>
        <div class="alan"><label>Mevcut şifre</label><input type="password" id="hsEski" autocomplete="current-password"></div>
        <div class="alan"><label>Yeni şifre</label><input type="password" id="hsYeni" autocomplete="new-password"></div>
        <div class="alan"><label>Yeni şifre (tekrar)</label><input type="password" id="hsYeni2" autocomplete="new-password"></div>
        <div id="hsMesaj"></div>
        <button class="btn-ana" type="submit">Şifreyi Değiştir</button>
      </form>
    </div>
    <div class="kart" style="margin-top:14px"><h3>Uygulama ve bildirimler</h3>
      <p class="soluk" style="margin-top:0">${esc(izinMetni())}</p>
      ${'Notification' in window && Notification.permission === 'default' ? '<button class="btn-cizgi" data-izin="1" style="margin:0 6px 6px 0">🔔 Bildirimleri aç</button>' : ''}
      ${kurulumOlayi ? '<button class="btn-ana" data-kur="1">📲 Uygulamayı yükle</button>'
        : standalone ? '<p>✓ Panel uygulama olarak açık.</p>'
        : ios ? '<p class="soluk">iPhone/iPad: Safari\'de <b>Paylaş</b> › <b>Ana Ekrana Ekle</b> ile paneli uygulama olarak ekleyin.</p>'
        : '<p class="soluk">Telefonda tarayıcı menüsünden <b>Ana ekrana ekle / Uygulamayı yükle</b> ile paneli uygulama olarak ekleyebilirsiniz.</p>'}
    </div>`;
  $('#sifreForm').addEventListener('submit', sifreDegistir);
}
async function sifreDegistir(e) {
  e.preventDefault();
  const m = $('#hsMesaj'), eski = $('#hsEski').value, y1 = $('#hsYeni').value, y2 = $('#hsYeni2').value;
  const goster = (t, tur) => { m.innerHTML = `<div class="${tur === 'ok' ? 'bilgi-kutu' : 'hata-kutu'}">${esc(t)}</div>`; };
  if (y1.length < 6) return goster('Yeni şifre en az 6 karakter olmalı.');
  if (y1 !== y2) return goster('Yeni şifreler aynı değil.');
  try {
    await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(kullanici.email, eski));
    await updatePassword(auth.currentUser, y1);
    e.target.reset(); goster('Şifreniz değiştirildi.', 'ok');
  } catch (err) {
    const k = String(err.code || '');
    goster(/wrong-password|invalid-credential|invalid-login/.test(k) ? 'Mevcut şifre hatalı.' : k.includes('weak') ? 'Yeni şifre çok zayıf.' : hataMetni(err));
  }
}

/* ------------------------------------------------------------------ */
/*  Tıklamalar                                                         */
/* ------------------------------------------------------------------ */
async function genelTik(e) {
  const b = e.target.closest('button, [data-git]'); if (!b) return;
  const d = b.dataset;
  try {
    if (d.git) { if (!$('#modal').classList.contains('gizli')) modalKapat(); sekmeGoster(d.git); return; }
    if (d.izin) { if (!$('#modal').classList.contains('gizli')) modalKapat(); await bildirimIzniIste(); return; }
    if (d.kur) { await kur(); return; }
    if (d.seritKapat) { yerel.koy(d.seritKapat, '1'); seritCiz(); return; }
    if (d.tonay) { b.disabled = true; try { await talepOnayla(d.tonay); } finally { b.disabled = false; } return; }
    if (d.tred) { b.disabled = true; try { await talepReddet(d.tred); } finally { b.disabled = false; } return; }
    if (d.detay) { detayKisi = d.detay; personelCiz(); window.scrollTo(0, 0); return; }
    if (d.geri) { detayKisi = null; personelCiz(); return; }
    if (d.psinir) { await kisiSinirDuzenle(d.psinir); return; }
    if (d.kyazdir) { kisiYazdir(d.kyazdir); return; }
    if (d.ekstre) { b.disabled = true; try { ekstreYazdir(d.ekstre, await ayinSiparisleri(d.ekstre)); } finally { b.disabled = false; } return; }
    if (d.ayexcel) { b.disabled = true; try { ayExcel(d.ayexcel, await ayinSiparisleri(d.ayexcel)); } finally { b.disabled = false; } return; }
    if (d.onayla) {
      b.disabled = true;
      await updateDoc(doc(db, 'musteriler', d.onayla), { durum: 'onayli', onayTarihi: serverTimestamp(), onaylayan: mod === 'kasa' ? 'kasa' : 'sirket' });
      bildir('Çalışan onaylandı.');
      return;
    }
    if (d.reddet) {
      const p = personel.find(x => x.id === d.reddet);
      if (!(await sor(`${p ? p.ad : 'Bu kişi'} kaydı reddedilsin mi?`, 'Reddet'))) return;
      await deleteDoc(doc(db, 'musteriler', d.reddet));
      bildir('Kayıt reddedildi.', 'uyari');
      return;
    }
    if (d.pdurum) {
      const p = personel.find(x => x.id === d.pdurum); if (!p) return;
      const kapat = p.durum === 'onayli';
      if (kapat && !(await sor(`${p.ad} kapatılsın mı? Şirket hesabınızdan yemek alamaz.`, 'Kapat'))) return;
      await updateDoc(doc(db, 'musteriler', p.id), { durum: kapat ? 'pasif' : 'onayli' });
      bildir(kapat ? 'Çalışan kapatıldı.' : 'Çalışan açıldı.', kapat ? 'uyari' : 'basari');
    }
  } catch (err) { hata(err); b.disabled = false; }
}

/* ------------------------------------------------------------------ */
/*  Yazdırma ve Excel                                                  */
/* ------------------------------------------------------------------ */
function yazdir(html) { $('#yazdirAlani').innerHTML = html; setTimeout(() => window.print(), 60); }
const yzUst = (baslik, sag) => `<div class="yz-ust"><div><div class="yz-lokanta">${esc(S.ad)}</div><div class="yz-baslik">${baslik}</div></div><div class="yz-sag">${esc(genel.lokantaAdi || '')}<br>${sag}</div></div>`;
function ekstreYazdir(ay, liste) {
  const ok = onayli(liste);
  const kisiler = Object.values(kisiOzetleri(liste)).sort((a, b) => trSirala(a.ad, b.ad));
  const h = hakedisler.find(x => x.ay === ay);
  yazdir(`${yzUst('YEMEK HESAP EKSTRESİ', 'Düzenleme: ' + new Date().toLocaleDateString('tr-TR'))}
    <table class="yz-bilgi"><tr><td>Dönem</td><td><b>${esc(ayAdi(ay))}</b></td><td>Hakediş</td><td>${h ? (h.durum === 'odendi' ? 'Ödendi' : 'Kesildi') + ' – ' + tl(h.toplam) : 'Kesilmedi'}</td></tr>
      <tr><td>Öğün sayısı</td><td>${ok.length}</td><td>Personel</td><td>${kisiler.length}</td></tr></table>
    <h3>Personel Özeti</h3>
    <table class="yz-tablo"><thead><tr><th>Personel</th><th class="sag">Öğün</th><th class="sag">Tutar</th></tr></thead><tbody>
      ${kisiler.map(k => `<tr><td>${esc(k.ad)}</td><td class="sag">${k.adet}</td><td class="sag">${tl(k.toplam)}</td></tr>`).join('')}</tbody></table>
    <h3>Yemek Dökümü</h3>
    <table class="yz-tablo"><thead><tr><th>Tarih</th><th>Saat</th><th>Personel</th><th>Yemekler</th><th class="sag">Tutar</th></tr></thead><tbody>
      ${ok.map(s => `<tr><td>${tarihFmt(s.olusturma)}</td><td>${saatFmt(s.olusturma)}</td><td>${esc(s.musteriAd || '—')}</td><td>${esc(kalemOzet(s.kalemler))}</td><td class="sag">${tl(s.toplam)}</td></tr>`).join('')}</tbody></table>
    <div class="yz-toplam">GENEL TOPLAM: ${tl(toplamTutar(ok))}</div>`);
}
function kisiYazdir(id) {
  const p = personel.find(x => x.id === id); if (!p) return;
  const ok = onayli(siparisler.filter(s => s.musteriId === id));
  yazdir(`${yzUst('PERSONEL YEMEK DÖKÜMÜ', esc(ayAdi(seciliAy)))}
    <table class="yz-bilgi"><tr><td>Personel</td><td><b>${esc(p.ad)}</b></td><td>Öğün</td><td>${ok.length}</td></tr></table>
    <table class="yz-tablo"><thead><tr><th>Tarih</th><th>Saat</th><th>Yemekler</th><th class="sag">Tutar</th></tr></thead><tbody>
      ${ok.map(s => `<tr><td>${tarihFmt(s.olusturma)}</td><td>${saatFmt(s.olusturma)}</td><td>${esc(kalemOzet(s.kalemler))}</td><td class="sag">${tl(s.toplam)}</td></tr>`).join('')}</tbody></table>
    <div class="yz-toplam">TOPLAM: ${tl(toplamTutar(ok))}</div>`);
}
function csvIndir(ad, satirlar) {
  const hucre = h => { let s = String(h ?? ''); if (/^[=+\-@]/.test(s) && !/^-?\d/.test(s)) s = "'" + s; return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + satirlar.map(r => r.map(hucre).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = ad; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const csvSayi = n => yuvarla(n).toFixed(2).replace('.', ',');
const dosyaAdi = s => String(s).replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '-').slice(0, 60);
function ayExcel(ay, liste) {
  const ok = onayli(liste);
  const r = [['Şirket', S.ad], ['Dönem', ayAdi(ay)], [], ['Tarih', 'Saat', 'Personel', 'Yemekler', 'Tutar (TL)']];
  ok.forEach(s => r.push([tarihFmt(s.olusturma), saatFmt(s.olusturma), s.musteriAd || '', kalemOzet(s.kalemler), csvSayi(s.toplam)]));
  r.push(['', '', '', 'TOPLAM', csvSayi(toplamTutar(ok))]);
  csvIndir(`yemek-${dosyaAdi(S.ad)}-${ay}.csv`, r);
}
</script>
