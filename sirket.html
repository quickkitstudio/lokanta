<!DOCTYPE html>
<!-- =====================================================================
     LOKANTA VERESİYE — ŞİRKET PANELİ
     Anlaşmalı şirketin yetkilisi girer: çalışanlarının hangi gün ne yediğini,
     harcamaları, hakedişleri görür; çalışan onaylar, öğün ve menü sınırı koyar.
     Kasa hesabıyla açılırsa (kasada Şirketler › Panel) tüm şirketler görülebilir.
     ===================================================================== -->
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Şirket Paneli">
<title>Şirket Paneli</title>
<link rel="manifest" href="manifest-sirket.json">
<link rel="icon" href="icon-sirket-192.png">
<link rel="apple-touch-icon" href="icon-sirket-192.png">
<style>

#netlify-deploy-badge {
    display: none !important;
}

:root{
  --ana:#c2410c;--ana-koyu:#9a3412;--ana-acik:#fff1e6;--ana-cizgi:#fdba74;
  --yesil:#15803d;--yesil-acik:#ecfdf3;--kirmizi:#b91c1c;--kirmizi-acik:#fef2f2;
  --sari:#b45309;--sari-acik:#fffbeb;--mavi:#1d4ed8;--mavi-acik:#eff6ff;
  --metin:#1c1917;--ikincil:#57534e;--soluk:#78716c;--cizgi:#e7e5e4;--zemin:#f5f5f4;--kart:#fff;--koyu:#1c1917;
  --golge:0 1px 2px rgba(28,25,23,.06),0 4px 14px rgba(28,25,23,.06);--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--zemin);color:var(--metin);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0 0 .5em;line-height:1.2}
h2{font-size:21px}h3{font-size:16px}
p{margin:.4em 0}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid transparent;border-radius:10px;padding:10px 16px;background:#e7e5e4;color:var(--metin);transition:background .15s,border-color .15s;touch-action:manipulation}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-ana{background:var(--ana);color:#fff}.btn-ana:hover:not(:disabled){background:var(--ana-koyu)}
.btn-yesil{background:var(--yesil);color:#fff}
.btn-kirmizi{background:var(--kirmizi);color:#fff}
.btn-cizgi{background:#fff;border-color:var(--cizgi)}.btn-cizgi:hover:not(:disabled){border-color:var(--ana-cizgi);background:var(--ana-acik)}
.btn-kucuk{padding:6px 10px;font-size:13px;border-radius:8px}
.btn-blok{width:100%}
.btn-link{background:none;border:0;padding:0;color:var(--ana);font-weight:600;text-decoration:underline;cursor:pointer}
input,select{font:inherit;color:var(--metin);padding:10px 12px;border:1px solid #d6d3d1;border-radius:10px;background:#fff;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--ana);outline-offset:-1px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ana)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ikincil);margin:0 0 5px}
.alan{margin-bottom:12px}
.gizli{display:none!important}
.soluk{color:var(--soluk)}
.sag{text-align:right}
.kart{background:var(--kart);border-radius:var(--r);box-shadow:var(--golge);padding:18px}
.bos{text-align:center;color:var(--soluk);padding:28px 12px}
.tam-orta{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px;background:var(--zemin);z-index:50}
.donen{width:34px;height:34px;border:4px solid #e7e5e4;border-top-color:var(--ana);border-radius:50%;animation:don .8s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.hata-kutu{background:var(--kirmizi-acik);color:var(--kirmizi);border:1px solid #fecaca;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.bilgi-kutu{background:var(--mavi-acik);color:#1e3a8a;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.etiket{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#f5f5f4;color:var(--ikincil);white-space:nowrap}
.etiket.yesil{background:var(--yesil-acik);color:var(--yesil)}
.etiket.sari{background:var(--sari-acik);color:var(--sari)}
.etiket.kirmizi{background:var(--kirmizi-acik);color:var(--kirmizi)}
.etiket.mavi{background:var(--mavi-acik);color:var(--mavi)}

/* Giriş */
.giris-kart{width:100%;max-width:390px}
.giris-kart .logo{font-size:42px;text-align:center}
.giris-kart h1{text-align:center;font-size:23px;margin:6px 0 4px}
.giris-kart>p{text-align:center;margin:0 0 18px}

/* Üst bölüm */
.ust{background:#fff;border-bottom:1px solid var(--cizgi);position:sticky;top:0;z-index:10}
.ust-ic{max-width:1240px;margin:0 auto;padding:12px 16px 0}
.ust-satir{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marka{display:flex;align-items:center;gap:12px;min-width:0}
.marka-ikon{width:42px;height:42px;border-radius:12px;background:var(--ana-acik);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.marka b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marka small{color:var(--soluk)}
.kim{display:flex;align-items:center;gap:10px;flex-shrink:0}
.kim span{color:var(--ikincil);font-size:14px}
.sekmeler{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.sekmeler::-webkit-scrollbar{display:none}
.sekmeler button{background:none;border-radius:0;border-bottom:3px solid transparent;color:var(--ikincil);padding:10px 14px;white-space:nowrap}
.sekmeler button:hover{color:var(--metin)}
.sekmeler button.aktif{color:var(--ana);border-bottom-color:var(--ana)}
.rozet{display:inline-block;min-width:20px;padding:1px 6px;border-radius:999px;background:#ef4444;color:#fff;font-size:11.5px;margin-left:4px;text-align:center}
.kasa-bant{background:var(--sari-acik);border-bottom:1px solid #fde68a;color:#78350f;font-size:14px}
.kasa-bant div{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kasa-bant select{width:auto;padding:6px 10px}
main{max-width:1240px;margin:0 auto;padding:16px}
.donem-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.donem-bar b{font-size:18px;min-width:150px;text-align:center}
.sayfa-baslik{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sayfa-baslik h2{margin:0}
.butonlar{display:flex;gap:8px;flex-wrap:wrap}

/* Özet */
.ozet-kartlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.ozet-kart{background:#fff;border-radius:var(--r);box-shadow:var(--golge);padding:14px 16px}
.ozet-kart small{display:block;color:var(--soluk);font-weight:600;margin-bottom:4px}
.ozet-kart b{font-size:24px;letter-spacing:-.3px}
.ozet-kart .alt{font-size:12.5px;color:var(--soluk);margin-top:2px}
.izgara-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:start}
.butce-cubuk{height:12px;background:#f0efee;border-radius:9px;overflow:hidden;margin:10px 0 6px}
.butce-cubuk i{display:block;height:100%;background:var(--yesil);border-radius:9px}
.butce-cubuk i.uyar{background:#f59e0b}.butce-cubuk i.asim{background:var(--kirmizi)}
.g-sutunlar{display:flex;align-items:flex-end;gap:3px;height:170px;border-bottom:1px solid var(--cizgi);margin-top:6px}
.g-sutun{flex:1;height:100%;display:flex;align-items:flex-end;border-radius:4px 4px 0 0}
.g-sutun.hs{background:#fafaf9}
.g-sutun i{display:block;width:100%;background:var(--ana-cizgi);border-radius:4px 4px 0 0}
.g-sutun.bugun i{background:var(--ana)}
.g-sutun:hover i{filter:brightness(.88)}
.g-eksen{display:flex;gap:3px;margin-top:4px}
.g-eksen span{flex:1;text-align:center;font-size:10.5px;color:var(--soluk);min-width:0}
.sira{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--cizgi)}
.sira:last-child{border-bottom:0}
.sira .cubuk{grid-column:1/-1;height:6px;background:#f0efee;border-radius:9px;overflow:hidden}
.sira .cubuk i{display:block;height:100%;background:var(--ana-cizgi)}
.liste-satir{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--cizgi);font-size:14px}
.liste-satir:last-child{border-bottom:0}

/* Tablolar */
.tablo-kap{overflow-x:auto;background:#fff;border-radius:var(--r);box-shadow:var(--golge)}
.tablo{width:100%;border-collapse:collapse;font-size:14px}
.tablo th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--soluk);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--cizgi);background:#fafaf9;white-space:nowrap}
.tablo td{padding:10px 12px;border-bottom:1px solid #f0efee;vertical-align:top}
.tablo tbody tr:last-child td{border-bottom:none}
.tablo tbody tr:hover{background:#fafaf9}
.tablo td.kalemler{color:var(--ikincil);max-width:360px}
.tablo tfoot td{font-weight:800;background:#fafaf9;border-top:2px solid var(--cizgi)}
.tablo .sag{text-align:right}
.tablo tr.gun-satir td{background:#fafaf9;font-weight:700;font-size:13px;color:var(--ikincil)}
.tablo tr.iptal td{color:#a8a29e}
.tablo tr.iptal td.tutar{text-decoration:line-through}
.islemler{white-space:nowrap}
.islemler button{margin-left:4px}
.filtre{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filtre select,.filtre input[type=search]{width:auto;min-width:200px;flex:1;max-width:320px}
.filtre label{display:flex;align-items:center;gap:6px;margin:0;font-size:14px;color:var(--metin)}

/* Personel */
.bekleyen-bolum{background:var(--sari-acik);border:1px solid #fde68a;border-radius:var(--r);padding:14px;margin-bottom:16px}
.bekleyen-kart{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:12px;margin-top:10px;box-shadow:var(--golge);flex-wrap:wrap}
.kullanim{margin:8px 0}
.kullanim .ust-s{display:flex;justify-content:space-between;font-size:14px}
.kullanim .cubuk{height:8px;background:#f0efee;border-radius:9px;overflow:hidden;margin-top:4px}
.kullanim .cubuk i{display:block;height:100%;background:var(--yesil)}
.kullanim .cubuk i.dolu{background:var(--kirmizi)}
.kural-cipler{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kural-cipler span{background:var(--ana-acik);color:#7c2d12;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}

/* Sınırlar formu */
.form-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 16px}
.ipucu{font-size:12.5px;color:var(--soluk);margin-top:4px}
.gun-sec{display:flex;flex-wrap:wrap;gap:6px}
.gun-sec label{display:flex;align-items:center;gap:6px;margin:0;padding:8px 12px;border:1px solid var(--cizgi);border-radius:10px;background:#fff;font-size:14px;color:var(--metin);cursor:pointer}
.kat-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.kat-satir{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fafaf9;border:1px solid var(--cizgi);border-radius:10px;padding:8px 10px}
.kat-satir span{font-weight:600;font-size:14px}
.kat-satir select{width:150px;padding:7px 8px}
.bolum{margin-bottom:14px}
.bolum h3{margin-bottom:4px}
.kaydet-bar{position:sticky;bottom:0;background:linear-gradient(to top,var(--zemin) 70%,rgba(245,245,244,0));padding:14px 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Menü */
.menu-grup{margin-bottom:16px}
.menu-grup h3{color:var(--ikincil);font-size:13px;text-transform:uppercase;letter-spacing:.5px}

/* Pencere ve bildirim */
.modal-zemin{position:fixed;inset:0;background:rgba(28,25,23,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-kutu{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .2s ease-out}
.modal-bas{padding:16px 18px 6px;font-size:18px;font-weight:800}
.modal-govde{padding:8px 18px;overflow:auto}
.modal-alt{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;flex-wrap:wrap}
.secenek{display:flex;align-items:flex-start;gap:8px;margin:0 0 10px;font-size:14.5px;color:var(--metin);font-weight:500;cursor:pointer}
.secenek input{margin-top:3px}
.bildirimler{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(380px,calc(100vw - 32px))}
.bildirim{background:var(--koyu);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-weight:600;font-size:14px;border-left:5px solid #a8a29e}
.bildirim.basari{border-left-color:#22c55e}.bildirim.hata{border-left-color:#ef4444}.bildirim.uyari{border-left-color:#f59e0b}
.bildirim.cik{opacity:0;transition:.3s}

/* Bildirim zili, şeritler, talepler */
.ust{padding-top:env(safe-area-inset-top,0px)}
.zil{position:relative;width:40px;height:38px;padding:0;border-radius:10px;background:#fff;border:1px solid var(--cizgi);display:flex;align-items:center;justify-content:center}
.zil svg{width:20px;height:20px}
.zil .rozet{position:absolute;top:-7px;right:-7px;margin:0}
.serit{display:flex;align-items:center;gap:10px;background:#fff;border:1px dashed var(--ana-cizgi);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;flex-wrap:wrap}
.serit>span:first-child{font-size:20px}
.serit>div{flex:1;min-width:180px}
.serit.dikkat{background:var(--sari-acik);border:1px solid #fde68a;color:#78350f}
.talep-kart{background:#fff;border-radius:var(--r);box-shadow:var(--golge);padding:14px 16px;margin-bottom:10px;border-left:5px solid #f59e0b}
.talep-kart.onaylandi{border-left-color:#22c55e}.talep-kart.reddedildi{border-left-color:#ef4444}
.talep-ust{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.talep-sebep{margin:8px 0 0;padding-left:20px;color:var(--kirmizi);font-size:14px}
.talep-not{background:#fafaf9;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px;color:var(--ikincil)}
.bild-oge{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--cizgi);cursor:pointer}
.bild-oge:last-of-type{border-bottom:0}
.bild-oge .ik{font-size:20px}

@media (max-width:900px){ .izgara-2{grid-template-columns:1fr} }
@media (max-width:600px){
  .tablo.kartli thead{display:none}
  .tablo.kartli tr{display:block;border-bottom:1px solid var(--cizgi);padding:8px 4px}
  .tablo.kartli td{display:flex;justify-content:space-between;gap:10px;border:0;padding:4px 8px;text-align:right}
  .tablo.kartli td::before{content:attr(data-l);color:var(--soluk);font-size:12.5px;font-weight:600;text-align:left}
  .tablo.kartli td:first-child{justify-content:flex-start;text-align:left}
  .tablo.kartli td:first-child::before,.tablo.kartli td.islemler::before{content:none}
  .tablo.kartli td.islemler{justify-content:flex-end;flex-wrap:wrap;gap:4px}
  .tablo.kartli tbody tr:hover{background:none}
  .sekmeler button{padding:10px 11px}
  .modal-zemin{align-items:flex-end;padding:0}
  .modal-kutu{max-width:none;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .kim>span{display:none}
  .marka small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
  main{padding:12px}
  .filtre select,.filtre input[type=search]{max-width:none;min-width:0;width:100%}
  .ozet-kart b{font-size:20px}
}

/* Yazdırma */
#yazdirAlani{display:none}
@media print{
  @page{size:A4;margin:13mm}
  body{background:#fff}
  body>*:not(#yazdirAlani){display:none!important}
  #yazdirAlani{display:block!important;color:#000;font-size:10.5pt}
  .yz-ust{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  .yz-lokanta{font-size:17pt;font-weight:800}
  .yz-baslik{font-size:11pt;font-weight:700;letter-spacing:1px}
  .yz-sag{font-size:9.5pt;text-align:right}
  .yz-bilgi{width:100%;border-collapse:collapse;margin-bottom:12px}
  .yz-bilgi td{border:1px solid #999;padding:5px 7px}
  .yz-bilgi td:nth-child(odd){background:#f2f2f2;width:17%;font-weight:600}
  #yazdirAlani h3{font-size:11pt;margin:14px 0 6px}
  .yz-tablo{width:100%;border-collapse:collapse}
  .yz-tablo th,.yz-tablo td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
  .yz-tablo th{background:#eee;font-size:9.5pt}
  .yz-tablo .sag{text-align:right;white-space:nowrap}
  .yz-tablo tr{page-break-inside:avoid}
  .yz-toplam{text-align:right;font-size:14pt;font-weight:800;margin:12px 0 24px;padding-top:8px;border-top:2px solid #000}
}
</style>
</head>
<body>

<div id="yukleniyor" class="tam-orta"><div class="donen"></div><div class="soluk">Yükleniyor…</div></div>

<div id="kurulumHata" class="tam-orta gizli"><div class="kart" style="max-width:520px"><h2>⚠️ Kurulum gerekli</h2><p id="kurulumHataMetin"></p></div></div>

<div id="girisEkrani" class="tam-orta gizli">
  <form id="girisForm" class="kart giris-kart">
    <div class="logo">🏢</div>
    <h1>Şirket Paneli</h1>
    <p class="soluk" id="girisAlt">Lokantanın size verdiği bilgilerle giriş yapın</p>
    <div class="alan"><label for="gEposta">E-posta</label><input id="gEposta" type="email" autocomplete="username" required></div>
    <div class="alan"><label for="gSifre">Şifre</label><input id="gSifre" type="password" autocomplete="current-password" required></div>
    <div id="girisHata" class="hata-kutu gizli"></div>
    <div id="girisBilgi" class="bilgi-kutu gizli"></div>
    <button class="btn-ana btn-blok" type="submit" id="gBtn" style="padding:14px">Giriş Yap</button>
    <p style="text-align:center;margin-top:14px"><button type="button" class="btn-link" id="sifremiUnuttum">Şifremi unuttum</button></p>
  </form>
</div>

<div id="uygulama" class="gizli">
  <div class="kasa-bant gizli" id="kasaBant"><div>🔑 <b>Kasa görünümü</b> — şirket: <select id="kasaSirketSec"></select> <a href="kasa.html">Kasaya dön</a></div></div>
  <header class="ust">
    <div class="ust-ic">
      <div class="ust-satir">
        <div class="marka"><span class="marka-ikon">🏢</span><div><b id="baslikSirket">Şirket</b><small id="baslikAlt">Şirket Paneli</small></div></div>
        <div class="kim"><span id="kimAd"></span><button class="zil" id="btnZil" aria-label="Bildirimler" title="Bildirimler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="rozet gizli" id="zilRozet">0</span></button><button class="btn-cizgi btn-kucuk" id="btnCikis">Çıkış</button></div>
      </div>
      <nav class="sekmeler" id="sekmeler">
        <button data-sekme="ozet" class="aktif">📊 Özet</button>
        <button data-sekme="harcama">🧾 Harcamalar</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

window.__yuklendi = true;

/* ------------------------------------------------------------------ */
/*  Yardımcılar                                                        */
/* ------------------------------------------------------------------ */
const $ = (s, k = document) => k.querySelector(s);
const $$ = (s, k = document) => [...k.querySelectorAll(s)];
const KATEGORI_SIRA = ['Çorbalar', 'Ana Yemekler', 'Sebze Yemekleri', 'Pilav & Makarna', 'Salata & Meze', 'Tatlılar', 'İçecekler', 'Ekmek & Diğer'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const paraFmt = new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' });
const yuvarla = n => Math.round((Number(n) || 0) * 100) / 100;
const tl = n => paraFmt.format(yuvarla(n));
const iki = n => String(n).padStart(2, '0');
const gunStr = (d = new Date()) => `${d.getFullYear()}-${iki(d.getMonth() + 1)}-${iki(d.getDate())}`;
const ayStr = (d = new Date()) => `${d.getFullYear()}-${iki(d.getMonth() + 1)}`;
const tsMs = t => !t ? 0 : (typeof t.toMillis === 'function' ? t.toMillis() : (t.seconds ? t.seconds * 1000 : 0));
const saatFmt = t => { const ms = tsMs(t); return ms ? new Date(ms).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '—'; };
const tarihFmt = t => { const ms = tsMs(t); return ms ? new Date(ms).toLocaleDateString('tr-TR') : '—'; };
const tarihSaatFmt = t => { const ms = tsMs(t); return ms ? new Date(ms).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—'; };
const buyukHarf = s => s.charAt(0).toLocaleUpperCase('tr-TR') + s.slice(1);
const ayAdi = ay => { const [y, m] = String(ay).split('-').map(Number); return buyukHarf(new Date(y, m - 1, 1).toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' })); };
const gunAdi = g => { const [y, m, d] = String(g).split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' }); };
const kalemOzet = k => (k || []).map(x => (x.adet > 1 ? x.adet + '× ' : '') + x.ad).join(', ');
const trSirala = (a, b) => String(a ?? '').localeCompare(String(b ?? ''), 'tr');
const katSirala = (a, b) => { const ia = KATEGORI_SIRA.indexOf(a), ib = KATEGORI_SIRA.indexOf(b); const fa = ia < 0 ? 99 : ia, fb = ib < 0 ? 99 : ib; return fa !== fb ? fa - fb : trSirala(a, b); };
const fiyatOku = s => { s = String(s ?? '').trim().replace(/[₺\s]/g, ''); if (!s) return null; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return isFinite(n) && n >= 0 ? yuvarla(n) : NaN; };
const tamSayi = s => { s = String(s ?? '').trim(); if (!s) return null; const n = Number(s); return Number.isInteger(n) && n >= 0 ? n : NaN; };
const kisiAnahtari = s => s.musteriId || ('ad:' + (s.musteriAd || '—'));

function bildir(mesaj, tur = 'basari', sure = 3500) {
  const el = document.createElement('div');
  el.className = 'bildirim ' + tur; el.textContent = mesaj;
  $('#bildirimler').appendChild(el);
  setTimeout(() => { el.classList.add('cik'); setTimeout(() => el.remove(), 300); }, sure);
}
function hataMetni(e) {
  const k = String(e?.code || '');
  if (k.includes('permission-denied')) return 'Bu işlem için yetkiniz yok (giriş kapatılmış olabilir).';
  if (k.includes('unavailable') || k.includes('network')) return 'Sunucuya ulaşılamıyor. İnternet bağlantınızı kontrol edin.';
  return 'Hata: ' + (e?.message || e);
}
const hata = e => { console.error(e); bildir(hataMetni(e), 'hata', 6000); };

let modalCoz = null;
function modal({ baslik, govde, butonlar = [{ yazi: 'Tamam', deger: true, sinif: 'btn-ana' }], acildi, dogrula }) {
  return new Promise(coz => {
    if (modalCoz) modalCoz({ deger: null, veri: {} });
    modalCoz = coz;
    $('#modalBaslik').textContent = baslik || '';
    $('#modalGovde').innerHTML = govde || '';
    $('#modalHata').classList.add('gizli');
    const alt = $('#modalAlt'); alt.innerHTML = '';
    butonlar.forEach(b => {
      const el = document.createElement('button');
      el.type = 'button'; el.textContent = b.yazi; el.className = b.sinif || 'btn-cizgi';
      el.addEventListener('click', () => {
        const veri = modalVerisi();
        if (b.dogrulansin && dogrula) {
          const h = dogrula(veri);
          if (h) { const hk = $('#modalHata'); hk.textContent = h; hk.classList.remove('gizli'); return; }
        }
        modalKapat({ deger: b.deger ?? null, veri });
      });
      alt.appendChild(el);
    });
    $('#modal').classList.remove('gizli');
    if (acildi) acildi($('#modalGovde'));
  });
}
function modalVerisi() {
  const v = {};
  $$('#modalGovde [data-ad]').forEach(e => {
    if (e.type === 'radio') { if (e.checked) v[e.dataset.ad] = e.value; }
    else v[e.dataset.ad] = e.type === 'checkbox' ? e.checked : e.value;
  });
  return v;
}
function modalKapat(sonuc) { $('#modal').classList.add('gizli'); const c = modalCoz; modalCoz = null; if (c) c(sonuc || { deger: null, veri: {} }); }
document.addEventListener('keydown', e => { if (!$('#modal').classList.contains('gizli') && e.key === 'Escape') modalKapat(); });
async function sor(mesaj, evet = 'Evet', sinif = 'btn-kirmizi') {
  const r = await modal({ baslik: 'Onay', govde: `<p style="margin-top:0">${esc(mesaj)}</p>`, butonlar: [{ yazi: 'Vazgeç', deger: false }, { yazi: evet, deger: true, sinif }] });
  return r.deger === true;
}

/* ------------------------------------------------------------------ */
/*  Durum                                                              */
/* ------------------------------------------------------------------ */
let auth, db, kullanici = null, basladi = false, girisMesaji = null;
let mod = null;                         // 'sirket' (şirket yetkilisi) | 'kasa' (lokanta)
let S = { id: null, ad: '' };           // görüntülenen şirket
let yetkiliBilgi = null, kasaSirketleri = [];
let genel = {}, ayar = {}, personel = [], siparisler = [], hakedisler = [], menuListe = null;
let seciliAy = ayStr(), sipUnsub = null, sekme = 'ozet', detayKisi = null;
let talepler = [], ilkPersonel = true, ilkTalep = true, kurulumOlayi = null;
const bilinenBekleyen = new Set(), bilinenTalep = new Set();
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const yerel = { al: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, koy: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* yok */ } } };
const kimAdi = () => mod === 'kasa' ? 'Lokanta' : ((yetkiliBilgi && yetkiliBilgi.ad) || kullanici.email);

/* ------------------------------------------------------------------ */
/*  Başlangıç ve giriş                                                 */
/* ------------------------------------------------------------------ */
const cfg = (typeof firebaseConfig !== 'undefined') ? firebaseConfig : null;
if (!cfg || !cfg.apiKey || /BURAYA/i.test(JSON.stringify(cfg))) {
  $('#yukleniyor').classList.add('gizli');
  $('#kurulumHataMetin').innerHTML = '<b>firebase-ayar.js</b> dosyasına Firebase bilgileri girilmemiş. Lokantaya bildirin.';
  $('#kurulumHata').classList.remove('gizli');
} else {
  baslat();
}

function baslat() {
  const app = initializeApp(cfg);
  auth = getAuth(app);
  db = getFirestore(app);
  olaylar();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('message', e => { const h = e.data && e.data.hedef; if (basladi && ['talep', 'personel'].includes(h)) sekmeGoster(h); });
  }
  onAuthStateChanged(auth, async k => {
    if (!k || k.isAnonymous) {
      if (basladi) { location.reload(); return; }
      if (k) await signOut(auth);
      girisGoster();
      return;
    }
    if (basladi) return;
    kullanici = k;
    // 1) Şirket yetkilisi mi?
    try {
      const y = await getDoc(doc(db, 'yetkililer', k.uid));
      if (y.exists()) {
        const v = y.data();
        if (!v.aktif) { girisMesaji = 'Girişiniz lokanta tarafından kapatılmış.'; await signOut(auth); return; }
        mod = 'sirket'; yetkiliBilgi = v; S = { id: v.sirketId, ad: v.sirketAd };
        panelAc();
        return;
      }
    } catch (e) { console.warn(e); }
    // 2) Kasa (lokanta) hesabı mı? → tüm şirketler görülebilir
    try {
      const l = await getDocs(collection(db, 'sirketler'));
      kasaSirketleri = l.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => trSirala(a.ad, b.ad));
      if (!kasaSirketleri.length) { girisMesaji = 'Henüz şirket tanımlanmamış (kasada Şirketler sekmesi).'; girisGoster(); return; }
      const istenen = new URLSearchParams(location.search).get('sirket');
      const s = kasaSirketleri.find(x => x.id === istenen) || kasaSirketleri[0];
      mod = 'kasa'; S = { id: s.id, ad: s.ad };
      panelAc();
    } catch (e) {
      girisMesaji = 'Bu hesap bir şirket paneline bağlı değil.';
      await signOut(auth);
    }
  });
}

function girisGoster() {
  const m = girisMesaji; girisMesaji = null;
  $('#yukleniyor').classList.add('gizli');
  $('#uygulama').classList.add('gizli');
  $('#girisEkrani').classList.remove('gizli');

}

async function girisYap(e) {

  $('#girisHata').classList.add('gizli'); $('#girisBilgi').classList.add('gizli');

  catch (err) {
    const k = String(err.code || '');
    $('#girisHata').textContent = /invalid|wrong|not-found/.test(k) ? 'E-posta veya şifre hatalı.' : k.includes('too-many') ? 'Çok fazla deneme. Biraz bekleyin.' : k.includes('network') ? 'İnternet bağlantısı yok.' : 'Giriş yapılamadı: ' + (err.message || k);
    $('#girisHata').classList.remove('gizli');
  } finally { b.disabled = false; b.textContent = 'Giriş Yap'; }
}

async function sifremiUnuttum() {
  const e = $('#gEposta').value.trim();
  $('#girisHata').classList.add('gizli');
  if (!e) { $('#girisHata').textContent = 'Önce e-posta adresinizi yazın.'; $('#girisHata').classList.remove('gizli'); return; }
  try {
    await sendPasswordResetEmail(auth, e);
    $('#girisBilgi').textContent = 'Şifre yenileme bağlantısı e-postanıza gönderildi. Gelmezse gereksiz (spam) klasörüne bakın.';

  } catch (err) { $('#girisHata').textContent = 'Gönderilemedi: ' + (err.message || err.code); $('#girisHata').classList.remove('gizli'); }

function olaylar() {
  $('#girisForm').addEventListener('submit', girisYap);
  $('#sifremiUnuttum').addEventListener('click', sifremiUnuttum);
  $('#sekmeler').addEventListener('click', e => { const b = e.target.closest('[data-sekme]'); if (b) sekmeGoster(b.dataset.sekme); });
  $('#btnCikis').addEventListener('click', async () => {
    if (mod === 'kasa') { location.href = 'kasa.html'; return; }
    if (!(await sor('Oturum kapatılsın mı?', 'Çıkış Yap'))) return;
    basladi = false; await signOut(auth); location.reload();
  });
  $('#kasaSirketSec').addEventListener('change', e => { location.search = '?sirket=' + encodeURIComponent(e.target.value); });
  $('#ayOnceki').addEventListener('click', () => ayKaydir(-1));
  $('#aySonraki').addEventListener('click', () => ayKaydir(1));
  $('#hKisi').addEventListener('change', harcamaCiz);
  $('#hAra').addEventListener('input', harcamaCiz);
  $('#hIptal').addEventListener('change', harcamaCiz);
  $('#hExcel').addEventListener('click', harcamaExcel);
  $('#hYazdir').addEventListener('click', () => ekstreYazdir(seciliAy, siparisler));
  $('#btnZil').addEventListener('click', zilAc);
  document.addEventListener('click', genelTik);
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); kurulumOlayi = e; if (basladi) { seritCiz(); if (sekme === 'hesap') hesapCiz(); } });
  window.addEventListener('appinstalled', () => { kurulumOlayi = null; if (basladi) seritCiz(); });
}

function panelAc() {
  basladi = true;
  $('#yukleniyor').classList.add('gizli'); $('#girisEkrani').classList.add('gizli'); $('#uygulama').classList.remove('gizli');
  if (mod === 'kasa') {
    $('#kasaBant').classList.remove('gizli');
    $('#kasaSirketSec').innerHTML = kasaSirketleri.map(s => `<option value="${s.id}" ${s.id === S.id ? 'selected' : ''}>${esc(s.ad)}</option>`).join('');
    $('#btnCikis').textContent = 'Kasaya dön';
    $('#kimAd').textContent = kullanici.email || '';
    $('#s-hesap').innerHTML = '';
    $('[data-sekme=hesap]').classList.add('gizli');
  } else {
    $('#kimAd').textContent = yetkiliBilgi.ad || kullanici.email;
  }

  dinle();
  seritCiz();

function baslikCiz() {
  $('#baslikSirket').textContent = S.ad || 'Şirket';
  $('#baslikAlt').textContent = (genel.lokantaAdi ? genel.lokantaAdi + ' · ' : '') + 'Şirket Paneli';

/* ------------------------------------------------------------------ */
/*  Bildirimler, rozetler, uygulama yükleme                            */
/* ------------------------------------------------------------------ */
function rozetGuncelle() {
  const np = personel.filter(p => p.durum === 'bekliyor').length;
  const nt = talepler.filter(t => t.durum === 'bekliyor').length;
  $('#rozet').textContent = np; $('#rozet').classList.toggle('gizli', !np);
  $('#talepRozet').textContent = nt; $('#talepRozet').classList.toggle('gizli', !nt);
  const n = np + nt;
  $('#zilRozet').textContent = n; $('#zilRozet').classList.toggle('gizli', !n);
  document.title = (n ? `(${n}) ` : '') + (S.ad || 'Şirket') + ' – Şirket Paneli';
  try { if (navigator.setAppBadge) { if (n) navigator.setAppBadge(n); else navigator.clearAppBadge(); } } catch (e) { /* desteklenmiyor */ }
}
async function sistemBildirimi(baslik, govde, hedef) {
  bildir(baslik + ' — ' + govde, 'uyari', 7000);
  try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) { /* yok */ }
  if (!('Notification' in window) || Notification.permission !== 'granted' || document.visibilityState === 'visible') return;
  try {
    const url = 'sirket.html' + (mod === 'kasa' ? '?sirket=' + encodeURIComponent(S.id) : '') + '#' + (hedef || '');
    const r = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
    if (r) await r.showNotification(baslik, { body: govde, icon: 'icon-sirket-192.png', badge: 'icon-sirket-192.png', tag: 'sirket-' + Date.now(), data: { url, hedef } });
    else new Notification(baslik, { body: govde, icon: 'icon-sirket-192.png' });
  } catch (e) { /* desteklenmiyor */ }
}
async function bildirimIzniIste() {
  if (!('Notification' in window)) { bildir(ios && !standalone ? 'iPhone/iPad\'de bildirim için önce paneli ana ekrana ekleyip oradan açın.' : 'Bu cihaz bildirimleri desteklemiyor.', 'uyari', 7000); return; }
  try { await Notification.requestPermission(); } catch (e) { /* yok */ }
  seritCiz(); if (sekme === 'hesap') hesapCiz();
  if (Notification.permission === 'granted') bildir('Bildirimler açıldı. Yeni kayıt ve taleplerde haber verilecek.');
  else if (Notification.permission === 'denied') bildir('Bildirim izni verilmedi. Tarayıcı / telefon ayarlarından açabilirsiniz.', 'uyari', 7000);
}
function izinMetni() {
  const d = 'Notification' in window ? Notification.permission : 'yok';

    : d === 'denied' ? 'Bildirimler engellenmiş. Tarayıcı / telefon ayarlarından bu siteye bildirim izni verebilirsiniz.'
    : d === 'yok' ? (ios && !standalone ? 'iPhone/iPad\'de bildirim için paneli önce ana ekrana ekleyin.' : 'Bu cihaz bildirimleri desteklemiyor.')
    : 'Yeni çalışan kaydı ve ekstra hak taleplerinde haber almak için bildirimleri açın.';
}
async function kur() {
  if (!kurulumOlayi) return;
  kurulumOlayi.prompt();

}
function seritCiz() {
  let h = '';
  if (mod === 'sirket') {
    if ('Notification' in window && Notification.permission === 'default' && yerel.al('sIzinKapat') !== '1')
      h += '<div class="serit"><span>🔔</span><div>Yeni çalışan kaydı ve ekstra hak taleplerinde bildirim almak için bildirimleri açın.</div><button class="btn-ana btn-kucuk" data-izin="1">Aç</button><button class="btn-cizgi btn-kucuk" data-serit-kapat="sIzinKapat" aria-label="Kapat">✕</button></div>';
    if (!standalone && yerel.al('sKurKapat') !== '1' && (kurulumOlayi || ios))
      h += `<div class="serit"><span>📲</span><div>${kurulumOlayi ? 'Paneli telefonunuza ya da bilgisayarınıza uygulama olarak yükleyin.' : 'iPhone/iPad: Safari\'de <b>Paylaş</b> › <b>Ana Ekrana Ekle</b> ile paneli uygulama olarak ekleyin.'}</div>${kurulumOlayi ? '<button class="btn-ana btn-kucuk" data-kur="1">Yükle</button>' : ''}<button class="btn-cizgi btn-kucuk" data-serit-kapat="sKurKapat" aria-label="Kapat">✕</button></div>`;
  }

}
function zilAc() {
  const bp = personel.filter(p => p.durum === 'bekliyor'), bt = talepler.filter(t => t.durum === 'bekliyor');
  const og = [
    ...bt.map(t => ({ ms: tsMs(t.olusturma), html: `<div class="bild-oge" data-git="talep"><span class="ik">🙋</span><div><b>${esc(t.musteriAd)}</b> ekstra hak istiyor<br><small class="soluk">${esc((t.sebepler || []).join(', ') || t.not || '')}</small><br><small class="soluk">${tarihSaatFmt(t.olusturma)}</small></div></div>` })),
    ...bp.map(p => ({ ms: tsMs(p.kayitTarihi), html: `<div class="bild-oge" data-git="personel"><span class="ik">👤</span><div><b>${esc(p.ad)}</b> kayıt oldu, onayınızı bekliyor<br><small class="soluk">${tarihSaatFmt(p.kayitTarihi)}</small></div></div>` }))
  ].sort((a, b) => b.ms - a.ms);
  const izin = 'Notification' in window && Notification.permission === 'default';
  modal({
    baslik: 'Bildirimler',
    govde: (og.length ? og.map(o => o.html).join('') : '<div class="bos">Bekleyen iş yok 🎉</div>') + (izin ? '<button class="btn-cizgi btn-blok" data-izin="1" style="margin-top:10px">🔔 Bu cihazda bildirimleri aç</button>' : ''),
    butonlar: [{ yazi: 'Kapat', sinif: 'btn-cizgi' }]
  });
}

/* ------------------------------------------------------------------ */
/*  Canlı veriler                                                      */
/* ------------------------------------------------------------------ */
function dinle() {
  onSnapshot(doc(db, 'genel', 'ayarlar'), s => { genel = s.exists() ? s.data() : {}; baslikCiz(); }, () => {});
  onSnapshot(doc(db, 'sirketAyar', S.id), s => {
    ayar = s.exists() ? s.data() : {};
    if (sekme === 'sinir' && !sinirFormuDegisti) sinirCiz();
    else if (sekme !== 'sinir') sekmeYenile();
  }, hata);
  onSnapshot(query(collection(db, 'musteriler'), where('sirketId', '==', S.id)), s => {
    personel = s.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
    const bek = personel.filter(p => p.durum === 'bekliyor');
    if (!ilkPersonel) bek.filter(p => !bilinenBekleyen.has(p.id)).forEach(p => sistemBildirimi('Yeni çalışan kaydı', `${p.ad} şirketinize kayıt oldu, onayınızı bekliyor.`, 'personel'));
    bek.forEach(p => bilinenBekleyen.add(p.id));
    ilkPersonel = false;
    rozetGuncelle();
    kisiSecimiCiz();
    if (sekme !== 'sinir') sekmeYenile();
  }, hata);
  onSnapshot(query(collection(db, 'hakTalepleri'), where('sirketId', '==', S.id)), s => {
    talepler = s.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })).sort((a, b) => tsMs(b.olusturma) - tsMs(a.olusturma));
    const bek = talepler.filter(t => t.durum === 'bekliyor');
    if (!ilkTalep) bek.filter(t => !bilinenTalep.has(t.id)).forEach(t => sistemBildirimi('Ekstra hak talebi', `${t.musteriAd}: ${(t.sebepler || []).join(', ') || t.not || 'ek yemek hakkı istiyor'}`, 'talep'));
    bek.forEach(t => bilinenTalep.add(t.id));
    ilkTalep = false;
    rozetGuncelle();
    if (sekme !== 'sinir') sekmeYenile();
  }, hata);
  onSnapshot(query(collection(db, 'hakedisler'), where('sirketId', '==', S.id)), s => {
    hakedisler = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.ay.localeCompare(a.ay));
    if (sekme === 'hakedis' || sekme === 'ozet') sekmeYenile();
  }, hata);
  siparisleriDinle();
}

function siparisleriDinle() {
  if (sipUnsub) sipUnsub();
  siparisler = [];
  $('#ayYazi').textContent = ayAdi(seciliAy);
  $('#aySonraki').disabled = seciliAy >= ayStr();
  sipUnsub = onSnapshot(query(collection(db, 'siparisler'), where('sirketId', '==', S.id), where('ay', '==', seciliAy)), s => {
    siparisler = s.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) })).sort((a, b) => tsMs(a.olusturma) - tsMs(b.olusturma));
    kisiSecimiCiz();
    if (sekme !== 'sinir') sekmeYenile();
  }, hata);
}
function ayKaydir(n) {
  const [y, m] = seciliAy.split('-').map(Number);
  const yeni = ayStr(new Date(y, m - 1 + n, 1));
  if (yeni > ayStr()) return;
  seciliAy = yeni;
  siparisleriDinle();
  sekmeYenile();
}

/* Sekmeler */
let sinirFormuDegisti = false;
function sekmeGoster(ad) {
  if (sekme === 'sinir' && ad !== 'sinir' && sinirFormuDegisti) {
    if (!confirm('Sınırlarda kaydedilmemiş değişiklik var. Çıkılsın mı?')) return;
    sinirFormuDegisti = false;
  }
  sekme = ad;
  if (ad !== 'personel') detayKisi = null;
  $$('#sekmeler [data-sekme]').forEach(b => b.classList.toggle('aktif', b.dataset.sekme === ad));
  const ab = $(`#sekmeler [data-sekme="${ad}"]`), nav = $('#sekmeler');
  if (ab && nav.scrollWidth > nav.clientWidth) nav.scrollTo({ left: ab.offsetLeft - nav.offsetLeft - (nav.clientWidth - ab.offsetWidth) / 2, behavior: 'smooth' });
  $$('.sekme').forEach(s => s.classList.toggle('gizli', s.id !== 's-' + ad));
  $('#donemBar').classList.toggle('gizli', !['ozet', 'harcama', 'personel'].includes(ad));
  sekmeYenile();
  window.scrollTo(0, 0);
}
function sekmeYenile() {
  if (!basladi) return;
  if (sekme === 'ozet') ozetCiz();
  else if (sekme === 'harcama') harcamaCiz();
  else if (sekme === 'personel') personelCiz();
  else if (sekme === 'talep') talepCiz();
  else if (sekme === 'sinir') sinirCiz();
  else if (sekme === 'hakedis') hakedisCiz();
  else if (sekme === 'menu') menuCiz();
  else if (sekme === 'hesap') hesapCiz();
}

/* Ortak hesaplar */
const onayli = l => l.filter(s => s.durum === 'onaylandi');
const toplamTutar = l => yuvarla(l.reduce((t, s) => t + (s.toplam || 0), 0));
function kisiOzetleri(l) {
  const k = {};
  onayli(l).forEach(s => {
    const a = kisiAnahtari(s);
    if (!k[a]) k[a] = { anahtar: a, id: s.musteriId || null, ad: s.musteriAd || '—', adet: 0, toplam: 0, son: 0 };
    k[a].adet++; k[a].toplam = yuvarla(k[a].toplam + (s.toplam || 0)); k[a].son = Math.max(k[a].son, tsMs(s.olusturma));
  });
  return k;
}
function kisiLimiti(p) { return SINIR.birlestir(ayar.limit, p && p.limit); }
const ekHaklari = pid => talepler.filter(t => t.musteriId === pid && t.durum === 'onaylandi' && t.hak).map(t => t.hak);
// Seçili ayda geçerli kural (tanınan ekstra haklar dahil)
function kisiEtkinLimiti(p) {
  const buAyMi = seciliAy === ayStr();
  return SINIR.etkin(kisiLimiti(p), ekHaklari(p.id).filter(h => buAyMi || !h.gun), buAyMi ? gunStr() : seciliAy + '-01');
}
function asimMi(s) { return !!s.sinirAsimi || (s.durum === 'iptal' && /^Şirket sınırı/.test(s.iptalNedeni || '')); }

/* ------------------------------------------------------------------ */
/*  ÖZET                                                               */
/* ------------------------------------------------------------------ */
function ozetCiz() {
  const ok = onayli(siparisler), toplam = toplamTutar(siparisler);
  const kisiler = Object.values(kisiOzetleri(siparisler)).sort((a, b) => b.toplam - a.toplam);
  const aktifPersonel = personel.filter(p => p.durum === 'onayli').length;
  const buAyMi = seciliAy === ayStr();
  const bugunL = buAyMi ? ok.filter(s => s.gun === gunStr()) : [];
  const [y, m] = seciliAy.split('-').map(Number);
  const gunSayisi = new Date(y, m, 0).getDate();
  const gunluk = Array.from({ length: gunSayisi }, (_, i) => ({ gun: `${seciliAy}-${iki(i + 1)}`, n: 0, t: 0 }));
  ok.forEach(s => { const i = Number(String(s.gun || '').slice(8)) - 1; if (gunluk[i]) { gunluk[i].n++; gunluk[i].t += s.toplam || 0; } });
  const enCok = Math.max(1, ...gunluk.map(g => g.t));
  const hk = hakedisler.find(h => h.ay === seciliAy);
  const butce = Number(ayar.butce) || 0;
  const oran = butce ? toplam / butce * 100 : 0;
  const asimlar = siparisler.filter(asimMi);

  const bekP = personel.filter(p => p.durum === 'bekliyor').length, bekT = talepler.filter(t => t.durum === 'bekliyor').length;
  const dikkat = [bekT ? `<b>${bekT}</b> ekstra hak talebi` : '', bekP ? `<b>${bekP}</b> çalışan kaydı` : ''].filter(Boolean).join(' ve ');
  $('#s-ozet').innerHTML = `
    ${dikkat ? `<div class="serit dikkat"><span>⏳</span><div>${dikkat} onayınızı bekliyor.</div><button class="btn-ana btn-kucuk" data-git="${bekT ? 'talep' : 'personel'}">Görüntüle</button></div>` : ''}
    <div class="ozet-kartlar">
      <div class="ozet-kart"><small>${esc(ayAdi(seciliAy))} harcaması</small><b>${tl(toplam)}</b><div class="alt">${hk ? (hk.durum === 'odendi' ? '✓ Hakediş ödendi' : 'Hakediş kesildi: ' + tl(hk.toplam)) : 'Hakediş henüz kesilmedi'}</div></div>
      <div class="ozet-kart"><small>Öğün sayısı</small><b>${ok.length}</b><div class="alt">${buAyMi ? 'Bugün ' + bugunL.length + ' öğün' : '&nbsp;'}</div></div>
      <div class="ozet-kart"><small>Yemek yiyen personel</small><b>${kisiler.length}</b><div class="alt">${aktifPersonel} aktif kayıtlı personel</div></div>
      <div class="ozet-kart"><small>Öğün başı ortalama</small><b>${tl(ok.length ? toplam / ok.length : 0)}</b><div class="alt">Kişi başı ${tl(kisiler.length ? toplam / kisiler.length : 0)}</div></div>
    </div>
    ${butce ? `<div class="kart" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>Aylık şirket bütçesi</b><span>${tl(toplam)} / ${tl(butce)} <b>(%${Math.round(oran)})</b></span></div>
      <div class="butce-cubuk"><i class="${oran >= 100 ? 'asim' : oran >= 80 ? 'uyar' : ''}" style="width:${Math.min(100, oran)}%"></i></div>
      <small class="soluk">${oran >= 100 ? '⚠️ Bütçe aşıldı.' : oran >= 80 ? '⚠️ Bütçenin %80\'i kullanıldı.' : 'Kalan: ' + tl(butce - toplam)}</small></div>` : ''}
    <div class="izgara-2">
      <div class="kart">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><h3>Günlük harcama</h3><small class="soluk">en yüksek ${tl(enCok === 1 && !ok.length ? 0 : enCok)}</small></div>
        <div class="g-sutunlar">${gunluk.map(g => {
          const gd = new Date(y, m - 1, Number(g.gun.slice(8))).getDay();
          return `<div class="g-sutun ${gd === 0 || gd === 6 ? 'hs' : ''} ${g.gun === gunStr() ? 'bugun' : ''}" title="${esc(gunAdi(g.gun))}: ${tl(g.t)} (${g.n} öğün)"><i style="height:${g.t ? Math.max(2, g.t / enCok * 100) : 0}%"></i></div>`;
        }).join('')}</div>
        <div class="g-eksen">${gunluk.map((g, i) => `<span>${(i + 1) % 5 === 0 || i === 0 ? i + 1 : ''}</span>`).join('')}</div>
      </div>
      <div class="kart">
        <h3>En çok harcayanlar</h3>
        ${kisiler.length ? kisiler.slice(0, 6).map(k => `<div class="sira"><span>${esc(k.ad)} <small class="soluk">· ${k.adet} öğün</small></span><b>${tl(k.toplam)}</b><div class="cubuk"><i style="width:${kisiler[0].toplam ? k.toplam / kisiler[0].toplam * 100 : 0}%"></i></div></div>`).join('') : '<div class="bos">Bu dönemde kayıt yok.</div>'}
      </div>
    </div>
    <div class="izgara-2">
      <div class="kart">
        <h3>${buAyMi ? 'Bugün yemek yiyenler' : 'Son yemekler'}</h3>
        ${(() => { const l = (buAyMi ? bugunL : ok).slice().reverse().slice(0, 12);
          return l.length ? l.map(s => `<div class="liste-satir"><span><b>${esc(s.musteriAd || '—')}</b> <small class="soluk">${buAyMi ? saatFmt(s.olusturma) : tarihFmt(s.olusturma)}</small><br><small class="soluk">${esc(kalemOzet(s.kalemler))}</small></span><b>${tl(s.toplam)}</b></div>`).join('') : '<div class="bos">Henüz yemek yok.</div>'; })()}
      </div>
      <div class="kart">
        <h3>Geçerli kurallar</h3>
        ${(() => { const o = SINIR.ozet(SINIR.birlestir(ayar.limit, null)); return o.length ? `<div class="kural-cipler">${o.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : '<p class="soluk">Sınır konulmamış. <button class="btn-link" data-git="sinir">Sınır koy ›</button></p>'; })()}
        <small class="soluk">${personel.filter(p => p.limit).length} personelde kişiye özel kural var.</small>
        ${asimlar.length ? `<h3 style="margin-top:14px">Sınır aşımları</h3>${asimlar.map(s => `<div class="liste-satir"><span><b>${esc(s.musteriAd || '—')}</b> <small class="soluk">${tarihFmt(s.olusturma)}</small><br><small style="color:var(--kirmizi)">${esc(s.sinirAsimi || s.iptalNedeni)}</small></span><span>${s.durum === 'iptal' ? '<span class="etiket">engellendi</span>' : tl(s.toplam)}</span></div>`).join('')}` : ''}
      </div>
    </div>`;
}

/* ------------------------------------------------------------------ */
/*  HARCAMALAR                                                         */
/* ------------------------------------------------------------------ */
function kisiSecimiCiz() {
  const sel = $('#hKisi'), v = sel.value;
  const adlar = {};
  personel.forEach(p => { adlar[p.id] = p.ad; });
  siparisler.forEach(s => { const a = kisiAnahtari(s); if (!adlar[a]) adlar[a] = s.musteriAd || '—'; });
  sel.innerHTML = '<option value="">Tüm personel</option>' + Object.entries(adlar).sort((a, b) => trSirala(a[1], b[1])).map(([k, ad]) => `<option value="${esc(k)}">${esc(ad)}</option>`).join('');
  if (adlar[v]) sel.value = v;
}
function filtreliHarcamalar() {
  const kisi = $('#hKisi').value, ara = $('#hAra').value.trim().toLocaleLowerCase('tr-TR'), iptal = $('#hIptal').checked;
  return siparisler.filter(s => (s.durum === 'onaylandi' || (iptal && s.durum === 'iptal' && s.sirketId))
    && (!kisi || kisiAnahtari(s) === kisi)
    && (!ara || `${s.musteriAd} ${kalemOzet(s.kalemler)}`.toLocaleLowerCase('tr-TR').includes(ara)));
}
function harcamaCiz() {
  if (sekme !== 'harcama') return;
  const l = filtreliHarcamalar().slice().sort((a, b) => tsMs(b.olusturma) - tsMs(a.olusturma));
  const ok = onayli(l);
  if (!l.length) { $('#harcamaIcerik').innerHTML = '<div class="kart bos">Bu dönemde kayıt yok.</div>'; return; }
  const gunler = {};
  l.forEach(s => { (gunler[s.gun] = gunler[s.gun] || []).push(s); });
  $('#harcamaIcerik').innerHTML = `
    <p class="soluk" style="margin-top:0"><b>${ok.length}</b> öğün · toplam <b>${tl(toplamTutar(ok))}</b></p>
    <div class="tablo-kap"><table class="tablo"><thead><tr><th>Saat</th><th>Personel</th><th>Yemekler</th><th class="sag">Tutar</th></tr></thead><tbody>
    ${Object.keys(gunler).sort().reverse().map(g => `
      <tr class="gun-satir"><td colspan="3">${esc(gunAdi(g))}</td><td class="sag">${tl(toplamTutar(onayli(gunler[g])))}</td></tr>
      ${gunler[g].map(s => `<tr class="${s.durum === 'iptal' ? 'iptal' : ''}">
        <td>${saatFmt(s.olusturma)}</td>
        <td><b>${esc(s.musteriAd || '—')}</b>${s.onaylayan === 'kasa' ? ' <span class="etiket mavi" title="Kasada elle işlendi">kasa</span>' : ''}${s.sinirAsimi ? ` <span class="etiket kirmizi" title="${esc(s.sinirAsimi)}">sınır aşımı</span>` : ''}${s.durum === 'iptal' ? ` <span class="etiket" title="${esc(s.iptalNedeni || '')}">iptal</span>` : ''}</td>
        <td class="kalemler">${esc(kalemOzet(s.kalemler))}</td>
        <td class="sag tutar">${tl(s.toplam)}</td></tr>`).join('')}`).join('')}
    </tbody><tfoot><tr><td colspan="3">Toplam (${ok.length} öğün)</td><td class="sag">${tl(toplamTutar(ok))}</td></tr></tfoot></table></div>`;
}
function harcamaExcel() {
  const l = onayli(filtreliHarcamalar());
  const r = [['Şirket', S.ad], ['Dönem', ayAdi(seciliAy)], [], ['Tarih', 'Saat', 'Personel', 'Yemekler', 'Tutar (TL)', 'Not']];
  l.forEach(s => r.push([tarihFmt(s.olusturma), saatFmt(s.olusturma), s.musteriAd || '', kalemOzet(s.kalemler), csvSayi(s.toplam), s.sinirAsimi ? 'Sınır aşımı: ' + s.sinirAsimi : '']));
  r.push(['', '', '', 'TOPLAM', csvSayi(toplamTutar(l)), '']);
  csvIndir(`yemek-${dosyaAdi(S.ad)}-${seciliAy}.csv`, r);
}

/* ------------------------------------------------------------------ */
/*  PERSONEL                                                           */
/* ------------------------------------------------------------------ */
function personelCiz() {
  if (detayKisi) { kisiDetayCiz(); return; }
  const ozet = kisiOzetleri(siparisler);
  const bekleyen = personel.filter(p => p.durum === 'bekliyor');
  const liste = personel.filter(p => p.durum !== 'bekliyor').sort((a, b) => (a.durum === b.durum ? 0 : a.durum === 'onayli' ? -1 : 1) || trSirala(a.ad, b.ad));
  $('#s-personel').innerHTML = `
    ${bekleyen.length ? `<div class="bekleyen-bolum"><h3 style="margin:0">⏳ Onay bekleyen çalışanlar</h3><small class="soluk">Uygulamadan kayıt olup şirketiniz olarak sizi seçenler. Onaylarsanız şirket hesabınızdan yemek alabilirler.</small>
      ${bekleyen.map(p => `<div class="bekleyen-kart"><div><b>${esc(p.ad)}</b> <span class="soluk">· ${esc(p.telefon || '')}</span><br><small class="soluk">Kayıt: ${tarihSaatFmt(p.kayitTarihi)}</small></div>
        <div class="butonlar"><button class="btn-cizgi btn-kucuk" data-reddet="${p.id}">Reddet</button><button class="btn-yesil btn-kucuk" data-onayla="${p.id}">✓ Onayla</button></div></div>`).join('')}</div>` : ''}
    <div class="sayfa-baslik"><span class="soluk">${liste.filter(p => p.durum === 'onayli').length} aktif personel · ${esc(ayAdi(seciliAy))} kullanımı</span></div>
    ${!liste.length ? '<div class="kart bos">Kayıtlı personel yok. Çalışanlarınız lokantanın müşteri uygulamasından kayıt olup şirket olarak sizi seçtiğinde burada onayınıza düşer.</div>' : `
    <div class="tablo-kap"><table class="tablo kartli"><thead><tr><th>Personel</th><th>Durum</th><th class="sag">Öğün</th><th class="sag">Tutar</th><th>Son yemek</th><th>Kural</th><th></th></tr></thead><tbody>
    ${liste.map(p => { const o = ozet[p.id] || { adet: 0, toplam: 0, son: 0 }; const lm = kisiEtkinLimiti(p);
      return `<tr><td><b>${esc(p.ad)}</b><br><small class="soluk">${esc(p.telefon || '')}</small></td>
        <td data-l="Durum">${p.durum === 'onayli' ? '<span class="etiket yesil">Aktif</span>' : '<span class="etiket kirmizi">Kapalı</span>'}</td>
        <td class="sag" data-l="Öğün">${o.adet}${lm.aylikOgun !== null && lm.aylikOgun !== undefined && !lm.sinirsiz ? `<small class="soluk"> / ${lm.aylikOgun}</small>` : ''}</td>
        <td class="sag" data-l="Tutar"><span><b>${tl(o.toplam)}</b>${lm.aylikTutar !== null && lm.aylikTutar !== undefined && !lm.sinirsiz ? `<small class="soluk"> / ${tl(lm.aylikTutar)}</small>` : ''}</span></td>
        <td data-l="Son yemek">${o.son ? tarihFmt(o.son) : '—'}</td>
        <td data-l="Kural"><span>${p.limit ? (p.limit.sinirsiz ? '<span class="etiket mavi">Sınırsız</span>' : '<span class="etiket sari">Kişiye özel</span>') : '<span class="etiket">Şirket</span>'}${lm.ekVar || lm.bugunSerbest ? ' <span class="etiket yesil">+ekstra</span>' : ''}</span></td>
        <td class="sag islemler"><button class="btn-cizgi btn-kucuk" data-detay="${p.id}">Detay</button><button class="btn-cizgi btn-kucuk" data-psinir="${p.id}">Sınır</button><button class="btn-cizgi btn-kucuk" data-pdurum="${p.id}">${p.durum === 'onayli' ? 'Kapat' : 'Aç'}</button></td></tr>`; }).join('')}
    </tbody></table></div>`}`;
}

function kisiDetayCiz() {
  const p = personel.find(x => x.id === detayKisi);
  if (!p) { detayKisi = null; personelCiz(); return; }
  const l = siparisler.filter(s => s.musteriId === p.id && (s.durum === 'onaylandi' || s.durum === 'iptal'));
  const ok = onayli(l);
  const lm = kisiLimiti(p);
  const lmE = kisiEtkinLimiti(p);
  const ekler = talepler.filter(t => t.musteriId === p.id && t.durum === 'onaylandi' && t.hak && t.hak.ay === seciliAy);
  const kTalepler = talepler.filter(t => t.musteriId === p.id).slice(0, 5);
  const bugun = ok.filter(s => s.gun === gunStr()).length;

async function kisiSinirDuzenle(id) {
  const p = personel.find(x => x.id === id); if (!p) return;
  const l = p.limit || {};
  const tip = !p.limit ? 'sirket' : l.sinirsiz ? 'sinirsiz' : 'ozel';
  const sirketK = SINIR.birlestir(ayar.limit, null);
  const yer = (a, birim) => sirketK[a] !== null && sirketK[a] !== undefined ? `şirket kuralı: ${birim === 'tl' ? tl(sirketK[a]) : sirketK[a]}` : 'sınırsız';
  const r = await modal({
    baslik: `${p.ad} – yemek kuralı`,
    govde: `<label class="secenek"><input type="radio" name="kt" data-ad="tip" value="sirket" ${tip === 'sirket' ? 'checked' : ''}><span><b>Şirket kuralları geçerli</b><br><small class="soluk">Sınırlar sekmesindeki genel kurallar uygulanır.</small></span></label>
      <label class="secenek"><input type="radio" name="kt" data-ad="tip" value="ozel" ${tip === 'ozel' ? 'checked' : ''}><span><b>Bu kişiye özel sınır</b><br><small class="soluk">Boş bıraktığınız alanlarda şirket kuralı geçerli olur.</small></span></label>
      <label class="secenek"><input type="radio" name="kt" data-ad="tip" value="sinirsiz" ${tip === 'sinirsiz' ? 'checked' : ''}><span><b>Sınırsız</b><br><small class="soluk">Bu kişiye hiçbir sınır uygulanmaz.</small></span></label>
      <div id="ozelAlan" class="form-izgara" style="grid-template-columns:1fr 1fr;margin-top:6px">
        <div><label>Günlük öğün</label><input data-ad="gunlukOgun" inputmode="numeric" value="${l.gunlukOgun ?? ''}" placeholder="${yer('gunlukOgun')}"></div>
        <div><label>Aylık öğün</label><input data-ad="aylikOgun" inputmode="numeric" value="${l.aylikOgun ?? ''}" placeholder="${yer('aylikOgun')}"></div>
        <div><label>Aylık tutar (₺)</label><input data-ad="aylikTutar" inputmode="decimal" value="${l.aylikTutar ?? ''}" placeholder="${yer('aylikTutar', 'tl')}"></div>
        <div><label>Öğün başına tutar (₺)</label><input data-ad="ogunTutar" inputmode="decimal" value="${l.ogunTutar ?? ''}" placeholder="${yer('ogunTutar', 'tl')}"></div>
      </div>`,
    butonlar: [{ yazi: 'Vazgeç' }, { yazi: 'Kaydet', deger: true, sinif: 'btn-ana', dogrulansin: true }],
    acildi: g => {
      const guncelle = () => { const t = ($('input[name=kt]:checked', g) || {}).value; $('#ozelAlan', g).style.display = t === 'ozel' ? '' : 'none'; };
      $$('input[name=kt]', g).forEach(i => i.addEventListener('change', guncelle));
      guncelle();
    },
    dogrula: v => {
      if (v.tip !== 'ozel') return null;
      if ([tamSayi(v.gunlukOgun), tamSayi(v.aylikOgun)].some(Number.isNaN)) return 'Öğün sayıları tam sayı olmalı.';
      if ([fiyatOku(v.aylikTutar), fiyatOku(v.ogunTutar)].some(Number.isNaN)) return 'Tutarları doğru yazın (örn. 250 veya 250,50).';
      return null;
    }
  });
  if (!r.deger) return;
  let limit = null;
  if (r.veri.tip === 'sinirsiz') limit = { sinirsiz: true };
  if (r.veri.tip === 'ozel') limit = { gunlukOgun: tamSayi(r.veri.gunlukOgun), aylikOgun: tamSayi(r.veri.aylikOgun), aylikTutar: fiyatOku(r.veri.aylikTutar), ogunTutar: fiyatOku(r.veri.ogunTutar) };
  try { await updateDoc(doc(db, 'musteriler', p.id), { limit }); bildir('Kaydedildi.'); } catch (e) { hata(e); }
}

function kullanimMetni(p) {
  if (seciliAy !== ayStr()) return '';
  const ok = onayli(siparisler.filter(s => s.musteriId === p.id));
  const lm = kisiEtkinLimiti(p);
  const bugun = ok.filter(s => s.gun === gunStr()).length;
  const par = [`Bu ay ${ok.length} öğün · ${tl(toplamTutar(ok))}`, `bugün ${bugun} öğün`];
  if (!lm.sinirsiz) {
    const k = SINIR.ozet(lm);
    if (k.length) par.push('kural: ' + k.join(', '));
  }
  return par.join(' — ');
}
function talepCiz() {
  const bek = talepler.filter(t => t.durum === 'bekliyor');
  const gecmis = talepler.filter(t => t.durum !== 'bekliyor').slice(0, 50);
  const kart = t => {
    const p = personel.find(x => x.id === t.musteriId);
    const km = t.durum === 'bekliyor' && p ? kullanimMetni(p) : '';
    return `<div class="talep-kart ${t.durum}">
      <div class="talep-ust"><div><b>${esc(t.musteriAd)}</b> <small class="soluk">· ${tarihSaatFmt(t.olusturma)}</small>${t.tutar ? `<br><small class="soluk">Kasada okuttuğu sipariş: <b>${tl(t.tutar)}</b></small>` : ''}</div>
        ${t.durum === 'bekliyor' ? `<div class="butonlar"><button class="btn-cizgi btn-kucuk" data-tred="${t.id}">Reddet</button><button class="btn-yesil btn-kucuk" data-tonay="${t.id}">✓ Hak tanı</button></div>` : t.durum === 'onaylandi' ? '<span class="etiket yesil">Onaylandı</span>' : '<span class="etiket kirmizi">Reddedildi</span>'}</div>
      ${(t.sebepler || []).length ? `<ul class="talep-sebep">${t.sebepler.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${t.not ? `<div class="talep-not">“${esc(t.not)}”</div>` : ''}
      ${km ? `<small class="soluk" style="display:block;margin-top:8px">${esc(km)}</small>` : ''}
      ${t.durum !== 'bekliyor' ? `<div style="margin-top:8px;font-size:14px">${t.durum === 'onaylandi' ? '<b>' + esc(SINIR.ekMetni(t.hak)) + '</b>' : ''}${t.cevap ? (t.durum === 'onaylandi' ? ' · ' : '') + esc(t.cevap) : ''}<br><small class="soluk">${esc(t.cevaplayan || '')} · ${tarihSaatFmt(t.cevapTarihi)}</small></div>` : ''}
    </div>`;
  };
  $('#s-talep').innerHTML = `
    <div class="sayfa-baslik"><h2>Ekstra hak talepleri</h2><small class="soluk">Hakkı biten çalışan uygulamadan ek hak ister; onaylarsanız hemen kullanabilir.</small></div>
    ${bek.length ? bek.map(kart).join('') : '<div class="kart bos">Bekleyen talep yok.</div>'}
    ${gecmis.length ? `<h3 style="margin-top:18px">Geçmiş talepler</h3>${gecmis.map(kart).join('')}` : ''}`;
}
async function talepOnayla(id) {
  const t = talepler.find(x => x.id === id); if (!t || t.durum !== 'bekliyor') return;
  const p = personel.find(x => x.id === t.musteriId);
  const seb = (t.sebepler || []).join(' ');
  const bugun = gunStr();
  const gun = t.gun && t.gun >= bugun ? t.gun : bugun;
  let tur = 'gunSinirsiz', miktar = 1;
  if (!seb || /Günlük öğün|Yemek hakkı yok/.test(seb)) tur = 'gunlukOgun';
  else if (/Aylık öğün/.test(seb)) tur = 'aylikOgun';
  else if (/Aylık tutar/.test(seb)) {
    tur = 'aylikTutar';
    let gerek = Number(t.tutar) || 100;
    if (p && seciliAy === ayStr()) {
      const lm = kisiEtkinLimiti(p);
      const ayT = toplamTutar(onayli(siparisler.filter(s => s.musteriId === p.id)));
      if (lm.aylikTutar !== null && lm.aylikTutar !== undefined) gerek = Math.max(1, ayT + (Number(t.tutar) || 0) - lm.aylikTutar);
    }
    miktar = Math.ceil(gerek);
  }
  const sec = (v, b, a) => `<label class="secenek"><input type="radio" name="ht" data-ad="tur" value="${v}" ${tur === v ? 'checked' : ''}><span><b>${b}</b><br><small class="soluk">${a}</small></span></label>`;
  const r = await modal({
    baslik: `${t.musteriAd} – ekstra hak`,
    govde: `${(t.sebepler || []).length ? `<ul class="talep-sebep" style="margin-top:0">${t.sebepler.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      <p style="margin:10px 0">Tanınacak hak:</p>
      ${sec('gunlukOgun', 'Ek öğün (tek gün)', 'Seçilen gün için günlük öğün hakkına eklenir.')}
      ${sec('aylikOgun', 'Bu ay ek öğün', 'Bu ayın öğün hakkına eklenir.')}
      ${sec('aylikTutar', 'Bu ay ek tutar', 'Bu ayın tutar sınırına eklenir.')}
      ${sec('gunSinirsiz', 'Bir günlük sınırsız', 'Seçilen gün tüm kurallar (saat, menü, tutar, öğün) kalkar.')}
      <div class="form-izgara" style="grid-template-columns:1fr 1fr">
        <div id="htMiktarAlan"><label id="htMiktarEtiket">Miktar</label><input data-ad="miktar" inputmode="decimal" value="${miktar}"></div>
        <div id="htGunAlan"><label>Gün</label><input type="date" data-ad="gun" value="${gun}" min="${bugun}"></div>
      </div>
      <div class="alan" style="margin-top:12px"><label>Çalışana not (isteğe bağlı)</label><input data-ad="cevap" maxlength="200" placeholder="Örn. Bu seferlik onaylandı."></div>`,
    butonlar: [{ yazi: 'Vazgeç' }, { yazi: '✓ Onayla', deger: true, sinif: 'btn-yesil', dogrulansin: true }],
    acildi: g => {
      const guncelle = () => {
        const v = ($('input[name=ht]:checked', g) || {}).value;
        $('#htMiktarAlan', g).style.display = v === 'gunSinirsiz' ? 'none' : '';
        $('#htGunAlan', g).style.display = v === 'gunlukOgun' || v === 'gunSinirsiz' ? '' : 'none';
        $('#htMiktarEtiket', g).textContent = v === 'aylikTutar' ? 'Ek tutar (₺)' : 'Ek öğün sayısı';
      };
      $$('input[name=ht]', g).forEach(i => i.addEventListener('change', guncelle));
      guncelle();
    },
    dogrula: v => {
      if (!v.tur) return 'Bir hak türü seçin.';
      if (v.tur === 'aylikTutar') { const n = fiyatOku(v.miktar); if (!n || Number.isNaN(n) || n > 100000) return 'Ek tutarı doğru yazın (örn. 250).'; }
      else if (v.tur !== 'gunSinirsiz') { const n = tamSayi(v.miktar); if (!n || Number.isNaN(n) || n > 31) return 'Ek öğün sayısı 1 ile 31 arasında olmalı.'; }
      if ((v.tur === 'gunlukOgun' || v.tur === 'gunSinirsiz') && !/^\d{4}-\d{2}-\d{2}$/.test(v.gun || '')) return 'Gün seçin.';
      return null;
    }
  });
  if (!r.deger) return;
  const v = r.veri;
  const hak = { tur: v.tur };
  if (v.tur === 'gunlukOgun' || v.tur === 'gunSinirsiz') { hak.gun = v.gun; hak.ay = v.gun.slice(0, 7); } else hak.ay = ayStr();
  if (v.tur === 'aylikTutar') hak.miktar = fiyatOku(v.miktar);
  else if (v.tur !== 'gunSinirsiz') hak.miktar = tamSayi(v.miktar);
  await updateDoc(doc(db, 'hakTalepleri', id), { durum: 'onaylandi', hak, cevap: String(v.cevap || '').trim().slice(0, 200), cevaplayan: kimAdi(), cevapTarihi: serverTimestamp() });
  bildir(`${t.musteriAd}: ${SINIR.ekMetni(hak)} tanındı. Çalışana bildirildi.`);
}
async function talepReddet(id) {
  const t = talepler.find(x => x.id === id); if (!t || t.durum !== 'bekliyor') return;
  const r = await modal({
    baslik: 'Talebi reddet',
    govde: `<p style="margin-top:0"><b>${esc(t.musteriAd)}</b> kişisinin ekstra hak talebi reddedilsin mi?</p><div class="alan"><label>Neden (isteğe bağlı, çalışan görür)</label><input data-ad="cevap" maxlength="200"></div>`,
    butonlar: [{ yazi: 'Vazgeç' }, { yazi: 'Reddet', deger: true, sinif: 'btn-kirmizi' }]

}

      </div>
      <div class="kart bolum"><h3>Aylık şirket bütçesi <small class="soluk">(bilgi amaçlı)</small></h3>
        <div class="form-izgara" style="margin-top:10px"><div><label>Bütçe (₺)</label><input id="fButce" inputmode="decimal" value="${deger(ayar.butce)}" placeholder="Yok"><div class="ipucu">Özet sayfasında doluluk gösterilir; %80'de uyarı verir. Yemek engellenmez.</div></div></div>
      </div>
      <div class="kaydet-bar"><button class="btn-ana" type="submit" id="fKaydet" style="padding:13px 28px">Kuralları Kaydet</button><span class="soluk" id="fDurum"></span></div>
    </form>`;
  sinirFormuDegisti = false;
  const f = $('#sinirForm');
  f.addEventListener('input', () => { sinirFormuDegisti = true; $('#fDurum').textContent = 'Kaydedilmemiş değişiklik var'; });
  f.addEventListener('change', () => { sinirFormuDegisti = true; $('#fDurum').textContent = 'Kaydedilmemiş değişiklik var'; });
  f.addEventListener('submit', sinirKaydet);
}
async function sinirKaydet(e) {
  e.preventDefault();
  const gunlukOgun = tamSayi($('#fGunluk').value), aylikOgun = tamSayi($('#fAylikOgun').value);
  const aylikTutar = fiyatOku($('#fAylikTutar').value), ogunTutar = fiyatOku($('#fOgunTutar').value), butce = fiyatOku($('#fButce').value);
  if ([gunlukOgun, aylikOgun].some(Number.isNaN)) { bildir('Öğün sınırları tam sayı olmalı.', 'hata'); return; }
  if ([aylikTutar, ogunTutar, butce].some(Number.isNaN)) { bildir('Tutarları doğru yazın (örn. 250 veya 250,50).', 'hata'); return; }
  const gunler = $$('[data-gun]').filter(c => c.checked).map(c => Number(c.dataset.gun)).sort();
  if (!gunler.length) { bildir('En az bir gün seçin. (Yemeği tamamen kapatmak için personeli "Kapat"ın.)', 'hata'); return; }
  const saatBas = $('#fSaatBas').value || null, saatBit = $('#fSaatBit').value || null;
  if (saatBas && saatBit && saatBas >= saatBit) { bildir('Saat başlangıcı bitişten önce olmalı.', 'hata'); return; }
  const kategori = {};
  $$('[data-kat]').forEach(s => { if (s.value !== '') kategori[s.dataset.kat] = Number(s.value); });
  const veri = {
    limit: { gunlukOgun, aylikOgun, aylikTutar, ogunTutar, gunler: gunler.length === 7 ? null : gunler, saatBas, saatBit, kategori },
    butce: butce || null,
    guncelleme: serverTimestamp(),
    guncelleyen: kimAdi()
  };
  const b = $('#fKaydet'); b.disabled = true;
  try {
    await setDoc(doc(db, 'sirketAyar', S.id), veri);
    sinirFormuDegisti = false;
    $('#fDurum').textContent = '✓ Kaydedildi';
    bildir('Kurallar kaydedildi. Çalışanlarınızın uygulamasında hemen geçerli olur.');
  } catch (err) { hata(err); }
  finally { b.disabled = false; }
}

/* ------------------------------------------------------------------ */
/*  HAKEDİŞ                                                            */
